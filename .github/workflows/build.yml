name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          cordova create myapp com.muslim.app "رفيق المسلم"
          cd myapp
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/myapp www/.github
          
          # ربط صورة الأيقونة تلقائياً
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          elif [ -f "../icon.jpg" ]; then
            cp ../icon.jpg www/icon.jpg
            sed -i '/<\/widget>/i \    <icon src="www/icon.jpg" />' config.xml
          fi

          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Muslim-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
