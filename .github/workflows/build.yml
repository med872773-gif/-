name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          
          # 1. إنشاء مشروع Cordova
          cordova create myapp com.muslim.app "رفيق المسلم"
          cd myapp
          
          # 2. تفريغ مجلد www ونسخ كل ملفات الموقع إليه
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/myapp www/.github

          # 3. التأكد من وجود ملف index.html
          if [ ! -f "www/index.html" ]; then
            find www/ -iname "index.html" -exec cp {} www/index.html \;
          fi

          # 4. إضافة منصة أندرويد أولاً
          cordova platform add android

          # 5. البحث عن أي صورة للأيقونة في المجلد الرئيسي ونسخها لكافة مجلدات الأيقونات للأندرويد
          ICON_FILE=$(find ../ -maxdepth 1 -iname "icon.png" -o -iname "icon.jpg" -o -iname "icon.jpeg" | head -n 1)
          
          if [ -n "$ICON_FILE" ]; then
            echo "Found icon at $ICON_FILE"
            RES_DIR="platforms/android/app/src/main/res"
            
            # استبدال صور ic_launcher في كافة المجلدات
            find $RES_DIR -type d -name "mipmap*" -exec cp "$ICON_FILE" {}/ic_launcher.png \; 2>/dev/null || true
            find $RES_DIR -type d -name "mipmap*" -exec cp "$ICON_FILE" {}/ic_launcher_round.png \; 2>/dev/null || true
            find $RES_DIR -type d -name "mipmap*" -exec cp "$ICON_FILE" {}/ic_launcher_foreground.png \; 2>/dev/null || true
            
            # حذف ملفات XML التكيّفية ليتم الاعتماد على الصورة مباشرة
            find $RES_DIR -name "ic_launcher*.xml" -delete 2>/dev/null || true
          fi

          # 6. بناء التطبيق
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Muslim-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
