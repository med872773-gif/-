name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          
          # 1. إنشاء مشروع Cordova جديد
          cordova create myapp com.muslim.app "رفيق المسلم"
          cd myapp
          
          # 2. تنظيف مجلد www ونسخ كل ملفات المستودع إليه
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/myapp www/.github

          # 3. التأكد من وجود ملف index.html
          if [ ! -f "www/index.html" ]; then
            find www/ -iname "index.html" -exec cp {} www/index.html \;
          fi

          # 4. تجهيز الصورة للأيقونة
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
          fi

          # 5. إنشاء ملف الإعدادات config.xml
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.muslim.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>رفيق المسلم</name>
              <description>تطبيق رفيق المسلم</description>
              <author email="dev@example.com" href="http://cordova.io">Muslim App Team</author>
              <content src="index.html" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <icon src="www/icon.png" />
              <preference name="Orientation" value="default" />
          </widget>
          EOF

          # 6. إضافة منصة أندرويد
          cordova platform add android

          # 7. استبدال الأيقونات لضمان ظهور الشعار
          RES_DIR="platforms/android/app/src/main/res"
          if [ -s "www/icon.png" ]; then
            find $RES_DIR -type d -name "mipmap*" -exec cp www/icon.png {}/ic_launcher.png \; 2>/dev/null || true
            find $RES_DIR -type d -name "mipmap*" -exec cp www/icon.png {}/ic_launcher_round.png \; 2>/dev/null || true
            find $RES_DIR -type d -name "mipmap*" -exec cp www/icon.png {}/ic_launcher_foreground.png \; 2>/dev/null || true
            find $RES_DIR -name "ic_launcher*.xml" -delete 2>/dev/null || true
          fi

          # 8. بناء التطبيق
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Muslim-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
