name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          cordova create myapp com.muslim.app "رفيق المسلم"
          cd myapp
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/myapp www/.github
          
          # إضافة المنصة أولاً
          cordova platform add android
          
          # نسخ الصورة لجميع مجلدات الأيقونات في الأندرويد (تضمن ظهورها على كل الهواتف)
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
            
            # نسخ الصورة لمجلدات mipmap الرسمية في الأندرويد
            RES_PATH="platforms/android/app/src/main/res"
            mkdir -p $RES_PATH/mipmap-ldpi $RES_PATH/mipmap-mdpi $RES_PATH/mipmap-hdpi $RES_PATH/mipmap-xhdpi $RES_PATH/mipmap-xxhdpi $RES_PATH/mipmap-xxxhdpi
            cp ../icon.png $RES_PATH/mipmap-ldpi/ic_launcher.png
            cp ../icon.png $RES_PATH/mipmap-mdpi/ic_launcher.png
            cp ../icon.png $RES_PATH/mipmap-hdpi/ic_launcher.png
            cp ../icon.png $RES_PATH/mipmap-xhdpi/ic_launcher.png
            cp ../icon.png $RES_PATH/mipmap-xxhdpi/ic_launcher.png
            cp ../icon.png $RES_PATH/mipmap-xxxhdpi/ic_launcher.png
            cp ../icon.png $RES_PATH/mipmap-ldpi/ic_launcher_foreground.png
            cp ../icon.png $RES_PATH/mipmap-mdpi/ic_launcher_foreground.png
            cp ../icon.png $RES_PATH/mipmap-hdpi/ic_launcher_foreground.png
            cp ../icon.png $RES_PATH/mipmap-xhdpi/ic_launcher_foreground.png
            cp ../icon.png $RES_PATH/mipmap-xxhdpi/ic_launcher_foreground.png
            cp ../icon.png $RES_PATH/mipmap-xxxhdpi/ic_launcher_foreground.png
          fi

          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Muslim-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
