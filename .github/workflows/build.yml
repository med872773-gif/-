name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          
          # إنشاء مشروع Cordova
          cordova create myapp com.muslim.app "رفيق المسلم"
          cd myapp
          
          # نسخ ملفات الموقع إلى www
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/myapp www/.github

          # كتابة ملف config.xml متوافق مع نظام أندرويد الحديث للأيقونات
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.muslim.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>رفيق المسلم</name>
              <description>تطبيق رفيق المسلم</description>
              <author>Muslim App</author>
              <content src="index.html" />
              <icon src="www/icon.png" />
              <platform name="android">
                  <icon src="www/icon.png" density="ldpi" />
                  <icon src="www/icon.png" density="mdpi" />
                  <icon src="www/icon.png" density="hdpi" />
                  <icon src="www/icon.png" density="xhdpi" />
                  <icon src="www/icon.png" density="xxhdpi" />
                  <icon src="www/icon.png" density="xxxhdpi" />
              </platform>
          </widget>
          EOF

          # نقل الصورة إلى www
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
          fi

          # إضافة منصة الأندرويد
          cordova platform add android

          # استبدال إجباري لجميع أيقونات النظام التكيفية (Adaptive Icons)
          RES_DIR="platforms/android/app/src/main/res"
          if [ -f "www/icon.png" ]; then
            find $RES_DIR -name "ic_launcher*.png" -exec cp www/icon.png {} \;
            find $RES_DIR -name "ic_launcher*.xml" -delete 2>/dev/null || true
          fi

          # بناء ملف APK
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Muslim-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
